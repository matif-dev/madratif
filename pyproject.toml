[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "madratif"
version = "0.1.0"
description = "MADRATIF - kontrol PC pribadi dari jarak jauh (Termux/terminal) lewat MQTT"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "MADRATIF" }]
keywords = ["remote", "control", "mqtt", "termux", "personal"]
# No third-party dependencies: the app is pure standard library (it ships its
# own tiny MQTT client), so it runs on a portable Python with no pip install.
dependencies = []

[project.scripts]
madratif = "madratif.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
